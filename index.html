<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="shortcut icon" href="./asserts/zepto-favicon.webp" type="image/x-icon">
<body>
    <!-- index page header nav bar start-->
    <nav>
        <section class="nav_section">
            <!-- index page logo start -->
            <aside id="left-nav-head" class="nav_aside">                
                <div id="logo">
                    <h2><i class="fa-solid fa-z"></i></h2>
                    <span id="address">
                        <p>Deliver <span>10 minutes</span></p>
                        <p class="location" id="location">
                            <i class="fa-solid fa-location-dot"></i>
                            <span id="demo">Select Address</span>

                        </p>
                    </span>
                </div>               
            </aside>
             <!-- index page logo end -->
            <!-- index page mid pager links start -->
            <aside id="mid-nav-head" class="nav_aside">
                <a href="" class="active">Home</a>
                <a href>Products</a>
            </aside>
            <!-- index page mid pager links end -->
            <!-- index page right user & cart start -->
            <aside id="right-nav-head" class="nav_aside">
                <span id="nav_user"><i class="fa-regular fa-user"></i></span>
                <span id="nav_cart"><i class="fa-regular fa-cart-shopping"></i></span>
            </aside>
              <!-- index page right user & cart end -->
        </section>
    </nav>
    <!-- index page header nav bar end-->
    <!-- Index page header banner start-->
    <header>
          <section id="banner_cotainer">
   
        <img src="./asserts/hero-background-1.png" alt="" >
        <img src="./asserts/hero-background-2.png" alt="">
        <img src="./asserts/hero-background-1.png" alt="" >
   
          </section>
    </header>
     <!-- Index page header banner end-->
    <!-- index page product categories start-->
    <section class="products_container">
        <!-- Product title -->
        <aside class="product_title"><h2>Shop by Category</h2></aside>
         <!-- Product title end-->
        <!-- product categories list start-->
        <aside class="product_items" id="product_items_list">
            <!-- <div class="items_grid">
                <div class="category_image"></div>
                <div class="category_name"></div>                
            </div> -->
        </aside>
        <!-- product categories list end-->
    </section>
    <!-- index page product categories end-->
     <!-- highlights -->
      <section class="high_container">
        <aside class="high_block">
            <div class="high_info one">
                <p class="icon">🚴</p>
                <p class="title">Free Delivery</p>
                <p class="description">On order above ₹149/-</p>
            </div>
            <div class="high_info two">
                <p class="icon">⚡</p>
                <p class="title">10 mins delivery</p>
                <p class="description">Lightening fast</p>
            </div>
            <div class="high_info three">
                <p class="icon">💸</p>
                <p class="title">Best Prices</p>
                <p class="description">Directly from farms</p>
            </div>
            <div class="high_info four">
                <p class="icon">🛍️</p>
                <p class="title">Wide assortment</p>
                <p class="description">5000+ products</p>
            </div>
        </aside>
      </section>
      <footer class="footer_container">
<aside class="footer_items">
    <h2 class="f_tit">Zepto</h2>
    <p class="footertag">&copy; 2026 | 10 Minutes Delivery</p>
    <p class="f_tag">194 products across 24 categories.</p>

</aside>
      </footer>
    <script src="./script.js"></script>
</body>

</html>
