<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="./product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="shortcut icon" href="./asserts/zepto-favicon.webp" type="image/x-icon">
</head>

<body>
    <nav>
        <section class="nav_section">
            <!-- index page logo start -->
            <aside id="left-nav-head" class="nav_aside">
                <div id="logo">
                    <a href="./index.html" class="active">
                        <h2><i class="fa-solid fa-z"></i></h2>
                    </a>
                    <span id="address">
                        <p>Deliver <span>10 minutes</span></p>
                        <p class="location" id="location">
                            <i class="fa-solid fa-location-dot"></i>
                            <span id="demo">Select Address</span>

                        </p>
                    </span>
                </div>
            </aside>
            <!-- index page logo end -->
            <!-- index page mid pager links start -->
            <aside id="mid-nav-head" class="nav_aside">
                <a href="./index.html">Home</a>
                <a class="active" href="./product.html">Products</a>
            </aside>
            <!-- index page mid pager links end -->
            <!-- index page right user & cart start -->
            <aside id="right-nav-head" class="nav_aside">
                <span id="nav_user"><i class="fa-regular fa-user"></i></span>
                <span id="nav_cart"><i class="fa-regular fa-cart-shopping" onclick="location.assign('./cat.html')"></i></span>
            </aside>
            <!-- index page right user & cart end -->
        </section>
    </nav>

    <header>
        <aside class="searchBar">
            <div class="searchInput">
                <i class="fa-solid fa-magnifying-glass search_icon"></i>
                <input type="text" placeholder="search products name" name="searchPro" id="searchPro">
                <a href="./index.html"><i class="fa-solid fa-arrow-right"></i>Browse products</a>
            </div>
        </aside>
    </header>
    <!-- index page product categories start-->
    <section class="products_container">


        <aside class="pro_cat_side_one">
            <h3>Sort By </h3>
            <div class="list_left_sort">
                <input type="radio" name="sortPro" id="Relevance" value="Relevance" checked><label
                    for="Relevance">Relevance</label>
            </div>
            <div class="list_left_sort">
                <input type="radio" name="sortPro" id="priceAsc" value="priceAsc"><label
                    for="priceAsc">PriceAsc</label>
            </div>
            <div class="list_left_sort">
                <input type="radio" name="sortPro" id="priceDesc" value="priceDesc"><label
                    for="priceDesc">PriceDesc</label>
            </div>
            <div class="list_left_sort">
                <input type="radio" name="sortPro" id="discountPrice" value="discountPrice"><label
                    for="discountPrice">DiscountPrice</label>
            </div>
            <div class="list_left_sort">
                <label for="maxPrice" id="mix_price">MaxPrice $<span>10</span></label>
                <input type="range" name="maxPrice" id="maxPrice" min="0" max="10" value="10">
            </div>
            <div class="list_left_sort">
                <input type="checkbox" name="inStock" id="inStock" value="inStock"><label for="inStock">InStock</label>
            </div>
            <span class="total">total:<span id="tot_vla_pro"></span></span>
        </aside>
        <!-- product categories list start-->
        <aside class="pro_cat_side_two product_items" id="product_items_list">
            
            <!-- <div class="items_grid">
                <div class="category_image"></div>
                <div class="category_name"></div>                
            </div> -->
        </aside>
        <!-- product categories list end-->
    </section>
    <!-- index page product categories end-->


    <!-- footer start -->
    <footer class="footer_container">
        <aside class="footer_items">
            <h2 class="f_tit">Zepto</h2>
            <p class="footertag">&copy; 2026 | 10 Minutes Delivery</p>
            <p class="f_tag">194 products across 24 categories.</p>

        </aside>
    </footer>
    <!-- footer end -->
    <script src="./product.js"></script>
    <script src="./crt.js"></script>
</body>

</html>
